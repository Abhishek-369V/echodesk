<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="-3 -3 1506 956" font-family="Helvetica, Arial, sans-serif"><g id="deeditor_bgCarrier" stroke-width="0">
  <rect id="dee_c_e" x="-3" y="-3" width="1506" height="956" rx="38.4" fill="#ecf4f4" strokewidth="0"/>
</g><metadata fill="#000000"><c2pa:manifest fill="#000000"></c2pa:manifest></metadata>
  <defs fill="#000000">
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth" fill="#000000">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth" fill="#000000">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth" fill="#000000">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth" fill="#000000">
      <path d="M0,0 L0,6 L8,3 z" fill="#2980b9"/>
    </marker>
  </defs>

  <text x="750" y="38" text-anchor="middle" font-size="26" fill="#1a1a1a">EchoDesk: Agent Architecture &amp; Triaging Flow</text>

  <!-- Customer Message -->
  <rect x="580" y="65" width="340" height="65" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="750" y="105" text-anchor="middle" font-size="19" fill="#1a1a1a">Customer Message</text>

  <line x1="750" y1="130" x2="750" y2="160" stroke="#1a1a1a" stroke-width="2" fill="#000000"/>
  <line x1="400" y1="160" x2="1080" y2="160" stroke="#1a1a1a" stroke-width="2" fill="#000000"/>
  <line x1="400" y1="160" x2="400" y2="185" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>
  <line x1="1080" y1="160" x2="1080" y2="185" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>

  <!-- LEFT: reply drafting branch -->
  <rect x="220" y="185" width="360" height="80" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="217" text-anchor="middle" font-size="18" fill="#1a1a1a">Few-Shot Intent</text>
  <text x="400" y="242" text-anchor="middle" font-size="18" fill="#1a1a1a">Classifier (LLM)</text>

  <line x1="400" y1="265" x2="400" y2="305" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>
  <text x="400" y="290" text-anchor="middle" font-size="14" fill="#333">Intent &amp; Conf.</text>

  <rect x="220" y="305" width="360" height="80" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="337" text-anchor="middle" font-size="18" fill="#1a1a1a">Reply Retriever</text>
  <text x="400" y="362" text-anchor="middle" font-size="18" fill="#1a1a1a">(TF-IDF Search)</text>

  <line x1="400" y1="385" x2="400" y2="425" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>
  <text x="435" y="418" text-anchor="middle" font-size="14" fill="#333">Top Match</text>

  <rect x="220" y="425" width="360" height="80" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="457" text-anchor="middle" font-size="18" fill="#1a1a1a">Reply Generator</text>
  <text x="400" y="482" text-anchor="middle" font-size="18" fill="#1a1a1a">(LLM Grounded)</text>

  <!-- RIGHT: escalation branch -->
  <rect x="900" y="185" width="360" height="80" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1080" y="217" text-anchor="middle" font-size="18" fill="#1a1a1a">Deterministic</text>
  <text x="1080" y="242" text-anchor="middle" font-size="18" fill="#1a1a1a">Rule Engine</text>

  <!-- dependency arrows: confidence + similarity feed into Rule Engine -->
  <path d="M 580 210 L 750 175 L 898 210" fill="none" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <text x="750" y="158" text-anchor="middle" font-size="13" fill="#2980b9">confidence</text>

  <path d="M 580 345 L 830 345 L 830 245 L 898 225" fill="none" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <text x="835" y="335" text-anchor="middle" font-size="13" fill="#2980b9">similarity</text>

  <line x1="1080" y1="265" x2="1080" y2="305" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>
  <text x="1080" y="298" text-anchor="middle" font-size="14" fill="#333">No Trigger</text>

  <rect x="900" y="305" width="360" height="80" rx="9" fill="#d6eaf8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1080" y="337" text-anchor="middle" font-size="18" fill="#1a1a1a">Hybrid Mode</text>
  <text x="1080" y="362" text-anchor="middle" font-size="18" fill="#1a1a1a">Enabled?</text>

  <line x1="1080" y1="385" x2="1080" y2="425" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow)" fill="#000000"/>
  <text x="1080" y="410" text-anchor="middle" font-size="14" fill="#333">Yes</text>

  <rect x="900" y="425" width="360" height="80" rx="9" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="1080" y="457" text-anchor="middle" font-size="18" fill="#1a1a1a">LLM Fallback</text>
  <text x="1080" y="482" text-anchor="middle" font-size="18" fill="#1a1a1a">Escalation Check</text>

  <!-- No branch on Hybrid Mode -> straight down to Escalate:No -->
  <line x1="1260" y1="345" x2="1310" y2="345" stroke="#27ae60" stroke-width="2" fill="#000000"/>
  <text x="1330" y="350" font-size="14" fill="#27ae60">No</text>
  <line x1="1310" y1="345" x2="1310" y2="775" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrowGreen)" fill="#000000"/>

  <!-- No Flag from LLM Fallback -> same Escalate:No column -->
  <line x1="1260" y1="465" x2="1310" y2="465" stroke="#27ae60" stroke-width="2" fill="#000000"/>
  <text x="1330" y="470" font-size="14" fill="#27ae60">No Flag</text>
  <line x1="1310" y1="465" x2="1310" y2="775" stroke="#27ae60" stroke-width="2.5" fill="#000000"/>

  <!-- Triggered (rule engine) -> Escalate:Yes -->
  <line x1="900" y1="225" x2="750" y2="225" stroke="#c0392b" stroke-width="2.5" fill="#000000"/>
  <text x="800" y="218" text-anchor="middle" font-size="14" fill="#c0392b">Triggered</text>
  <line x1="750" y1="225" x2="750" y2="775" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)" fill="#000000"/>

  <!-- Flagged (LLM fallback) -> Escalate:Yes -->
  <line x1="900" y1="475" x2="820" y2="475" stroke="#c0392b" stroke-width="2.5" fill="#000000"/>
  <text x="855" y="468" text-anchor="middle" font-size="14" fill="#c0392b">Flagged</text>
  <line x1="820" y1="475" x2="820" y2="775" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrowRed)" fill="#000000"/>

  <!-- Escalate boxes -->
  <rect x="600" y="775" width="290" height="80" rx="9" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="745" y="822" text-anchor="middle" font-size="19" fill="#1a1a1a">ESCALATE: YES</text>

  <rect x="1150" y="775" width="290" height="80" rx="9" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="1295" y="812" text-anchor="middle" font-size="18" fill="#1a1a1a">ESCALATE: NO</text>
  <text x="1295" y="834" text-anchor="middle" font-size="14" fill="#333">(Auto-Reply)</text>

  <!-- Legend -->
  <line x1="60" y1="800" x2="90" y2="800" stroke="#2980b9" stroke-width="2" stroke-dasharray="6,4" fill="#000000"/>
  <text x="100" y="805" font-size="13" fill="#333">cross-branch input (confidence / similarity)</text>
  <line x1="60" y1="820" x2="90" y2="820" stroke="#c0392b" stroke-width="2.5" fill="#000000"/>
  <text x="100" y="825" font-size="13" fill="#333">escalation triggered</text>
  <line x1="60" y1="840" x2="90" y2="840" stroke="#27ae60" stroke-width="2.5" fill="#000000"/>
  <text x="100" y="845" font-size="13" fill="#333">no escalation</text>
</svg>